name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: JavaScript syntax and tests
        run: |
          for script in MMM-RemoteTempMonitor.js MMM-RemoteTempStatusMonitor/*.js node_helper.js bin/*.js lib/*.js; do
            node --check "$script"
          done
          npm test
      - name: Python syntax and tests
        run: |
          python -m py_compile remote-service/*.py remote-service/*/*.py remote-service/Pi/install-full.sh
          python -m unittest discover -s tests -v
          python -m unittest discover -s test -p 'test_*.py' -v
      - name: Shell syntax
        run: |
          for script in remote-service/install.sh remote-service/Pi/install.sh remote-service/Pi/update.sh remote-service/Mac/install.sh; do
            bash -n "$script"
          done
